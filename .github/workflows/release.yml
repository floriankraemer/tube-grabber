name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          tag="$GITHUB_REF_NAME"
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ "$tag" =~ $re ]] || { echo "::error::tag '$tag' is not strict semver (MAJOR.MINOR.PATCH[-pre])"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "${BASH_REMATCH[4]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    uses: ./.github/workflows/tests.yml

  build:
    needs: [validate, test]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: TubeGrabber-*
          merge-multiple: true

      - run: cd assets && sha256sum * > SHA256SUMS

      # Draft: write the notes (docs: release notes template), then publish by hand.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "Tube Grabber $GITHUB_REF_NAME" --draft --generate-notes \
            $([ "$PRERELEASE" = true ] && echo --prerelease)
