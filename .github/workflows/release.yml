name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

jobs:
  release:
    name: Build and publish UI release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish UI for each RID
        run: |
          set -euxo pipefail
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish src/TubeGrabber.UI/TubeGrabber.UI.csproj \
              -c Release \
              -r "$rid" \
              --self-contained true \
              -o "dist/$rid" \
              /p:PublishSingleFile=true
            ui_name=TubeGrabber
            if [ "$rid" = "win-x64" ]; then ui_name=TubeGrabber.exe; fi
            if [ -f "dist/$rid/TubeGrabber.UI" ]; then mv "dist/$rid/TubeGrabber.UI" "dist/$rid/$ui_name"; fi
            if [ -f "dist/$rid/TubeGrabber.UI.exe" ]; then mv "dist/$rid/TubeGrabber.UI.exe" "dist/$rid/$ui_name"; fi
          done

      - name: Package archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          mkdir -p release
          (cd dist/win-x64 && zip -r "../../release/TubeGrabber-${TAG}-win-x64.zip" .)
          tar -czvf "release/TubeGrabber-${TAG}-linux-x64.tar.gz" -C dist/linux-x64 .
          tar -czvf "release/TubeGrabber-${TAG}-osx-x64.tar.gz" -C dist/osx-x64 .
          tar -czvf "release/TubeGrabber-${TAG}-osx-arm64.tar.gz" -C dist/osx-arm64 .

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Tube Grabber ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
